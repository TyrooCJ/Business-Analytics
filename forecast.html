<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyroo|CJ — Revenue Forecast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --ink:    #191919;
            --bg:     #FAFAF7;
            --blue:   #214295;
            --teal:   #025450;
            --green:  #5BA976;
            --yellow: #FFBE60;
            --maroon: #6E1B35;
            --sky:    #A6DDEE;
            --mid:    #e5e7eb;
            --soft:   #f3f4f6;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
        }
        .tnum { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }

        /* ── HEADER ── */
        header {
            max-width: 1400px; margin: 0 auto;
            padding: 32px 32px 0;
            display: flex; justify-content: space-between; align-items: flex-end;
            border-bottom: 2px solid var(--ink);
            padding-bottom: 24px;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-badge { background: var(--blue); color: #fff; font-weight: 700; font-size: 16px; padding: 3px 8px; }
        .nav-link { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; color: var(--blue); text-decoration: none; border-bottom: 1px solid var(--blue); padding-bottom: 1px; }
        .nav-link:hover { color: var(--ink); border-color: var(--ink); }
        h1 { font-family: 'Fraunces', serif; font-size: 38px; font-weight: 300; line-height: 1; }
        .page-sub { font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: #9ca3af; font-weight: 600; margin-top: 6px; }

        /* ── MAIN ── */
        main { max-width: 1400px; margin: 0 auto; padding: 40px 32px 80px; }

        /* ── CONTROLS ── */
        .controls {
            display: flex; gap: 32px; align-items: flex-end;
            padding: 20px 24px; background: #fff;
            border: 1px solid var(--mid); margin-bottom: 40px;
        }
        .ctrl-group { display: flex; flex-direction: column; gap: 6px; }
        .ctrl-label { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: #6b7280; }
        select, input[type=range] { font-family: 'DM Sans', sans-serif; font-size: 13px; border: 1px solid var(--mid); padding: 7px 12px; background: var(--bg); color: var(--ink); cursor: pointer; outline: none; }
        select:focus { border-color: var(--blue); }
        .run-btn {
            background: var(--blue); color: #fff; border: none; padding: 10px 28px;
            font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
            cursor: pointer; letter-spacing: .04em; transition: background .15s; white-space: nowrap;
        }
        .run-btn:hover { background: var(--ink); }
        .run-btn:disabled { background: #9ca3af; cursor: not-allowed; }

        /* ── LOADING ── */
        #loadingMsg { text-align: center; padding: 60px; font-family: 'Fraunces', serif; font-size: 20px; color: #9ca3af; display: none; }

        /* ── FORECAST HERO ── */
        .forecast-hero {
            display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 1px;
            background: var(--ink); margin-bottom: 40px;
        }
        .hero-cell {
            background: var(--bg); padding: 28px 24px;
        }
        .hero-cell.primary { background: var(--blue); color: #fff; }
        .hero-cell.primary .hero-label { color: rgba(255,255,255,.65); }
        .hero-cell.primary .hero-method { color: rgba(255,255,255,.5); }
        .hero-label { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: #6b7280; margin-bottom: 8px; }
        .hero-value { font-family: 'Fraunces', serif; font-size: 36px; font-weight: 300; line-height: 1; }
        .hero-sub { font-size: 12px; color: #9ca3af; margin-top: 6px; }
        .hero-method { font-size: 11px; color: #6b7280; margin-top: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
        .delta-up { color: var(--green); font-weight: 600; }
        .delta-dn { color: var(--maroon); font-weight: 600; }

        /* ── TWO-COL LAYOUT ── */
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 32px; }
        .full-col { margin-bottom: 32px; }

        /* ── SECTION CARD ── */
        .section-card {
            background: #fff; border: 1px solid var(--mid);
            padding: 24px;
        }
        .section-title {
            font-family: 'Fraunces', serif; font-size: 18px; font-weight: 400;
            margin-bottom: 4px;
        }
        .section-sub { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; margin-bottom: 20px; }

        /* ── METHOD BREAKDOWN ── */
        .method-grid { display: flex; flex-direction: column; gap: 10px; }
        .method-row {
            display: grid; grid-template-columns: 160px 1fr 80px 60px;
            align-items: center; gap: 12px; padding: 10px 14px;
            background: var(--soft); border-left: 3px solid transparent;
        }
        .method-row.best { border-left-color: var(--green); background: #f0fdf4; }
        .method-name { font-size: 13px; font-weight: 600; }
        .method-desc { font-size: 11px; color: #6b7280; }
        .method-bar-wrap { height: 6px; background: var(--mid); border-radius: 2px; }
        .method-bar { height: 6px; background: var(--blue); border-radius: 2px; transition: width .6s ease; }
        .method-val { font-size: 14px; font-weight: 600; font-family: 'Fraunces', serif; text-align: right; }
        .method-weight { font-size: 11px; color: #9ca3af; text-align: right; }

        /* ── GEO TABLE ── */
        .geo-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .geo-table th { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: #6b7280; padding: 8px 12px; text-align: right; border-bottom: 2px solid var(--ink); }
        .geo-table th:first-child { text-align: left; }
        .geo-table td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--mid); }
        .geo-table td:first-child { text-align: left; font-weight: 600; }
        .geo-table tr:last-child td { border-bottom: none; }
        .geo-table tr:hover td { background: var(--soft); }
        .confidence-bar { display: inline-block; width: 60px; height: 4px; background: var(--mid); border-radius: 2px; vertical-align: middle; margin-left: 6px; position: relative; }
        .confidence-fill { position: absolute; left: 0; top: 0; height: 4px; background: var(--sky); border-radius: 2px; }

        /* ── CHART ── */
        .chart-wrap { height: 320px; position: relative; }

        /* ── ACCOUNT TABLE ── */
        .acct-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .acct-table th { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: #6b7280; padding: 7px 10px; text-align: right; border-bottom: 2px solid var(--ink); white-space: nowrap; }
        .acct-table th:first-child { text-align: left; }
        .acct-table td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--mid); }
        .acct-table td:first-child { text-align: left; }
        .acct-table tr:last-child td { border-bottom: none; }
        .pill { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; }
        .pill-up { background: #f0fdf4; color: #166534; }
        .pill-dn { background: #fef2f2; color: #991b1b; }
        .pill-neu { background: var(--soft); color: #374151; }

        /* ── ASSUMPTIONS ── */
        .assumption-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .assumption-list li { font-size: 12px; color: #4b5563; padding: 8px 12px; background: var(--soft); border-left: 2px solid var(--mid); line-height: 1.5; }
        .assumption-list li strong { color: var(--ink); }

        /* ── RESPONSIVE ── */
        @media (max-width: 900px) {
            .two-col { grid-template-columns: 1fr; }
            .forecast-hero { grid-template-columns: 1fr 1fr; }
            header { flex-direction: column; align-items: flex-start; gap: 16px; }
        }

        .fade-in { animation: fadeIn .4s ease both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

// ── DATA LOADING ──────────────────────────────────────────────────────────────
let DB = null;

async function loadData() {
    const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${BRANCH}/${DATA_FILE}?t=${Date.now()}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Could not load latest.json');
    DB = await res.json();
    // Purge blocked
    BLOCKED_CIDS.forEach(cid => {
        if (DB.records)        delete DB.records[cid];
        if (DB.monthlyArchive) delete DB.monthlyArchive[cid];
        if (DB.userMappings)   delete DB.userMappings[cid];
    });
    document.getElementById('dataTag').textContent = `Data through ${DB.lastUpdated || '—'}`;
}

// ── TIME SERIES BUILDER ───────────────────────────────────────────────────────
// Returns array of {monthIndex, year, value} sorted chronologically
// monthIndex: 0=Jan, 11=Dec
const MONTH_KEY_MAP = {
    "Jan":0,"Feb":1,"Mar":2,"April":3,"Apr":3,"May":4,"June":5,"Jun":5,
    "July":6,"Jul":6,"Aug":7,"Sep":8,"Oct":9,"Nov":10,"Dec":11
};

function parseMonthKey(mk) {
    // Format: "Jan'24" or "April'25"
    const m = mk.match(/^([A-Za-z]+)'(\d{2})$/);
    if (!m) return null;
    const mo = MONTH_KEY_MAP[m[1]];
    if (mo === undefined) return null;
    return { month: mo, year: 2000 + parseInt(m[2]) };
}

function dateKeyParts(k) {
    const m = String(k).match(/^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/);
    if (!m) return null;
    let [,,mon,yr] = m;
    if (yr.length === 2) yr = '20' + yr;
    const idx = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
        .findIndex(x => mon.toLowerCase() === x.toLowerCase());
    return idx >= 0 ? { month: idx, year: parseInt(yr) } : null;
}

function getDaysInMonth(year, month) { return new Date(year, month + 1, 0).getDate(); }

// Build full monthly time series for a set of CIDs
function buildTimeSeries(cids, windowMonths) {
    // Latest date from liveRecords
    let maxDate = new Date(2026, 2, 31); // fallback Mar'26
    if (DB.records) {
        for (const cid of Object.keys(DB.records)) {
            for (const k of Object.keys(DB.records[cid].net || {})) {
                const d = dateKeyParts(k);
                if (d) {
                    const dt = new Date(d.year, d.month, 1);
                    if (dt > maxDate) maxDate = dt;
                }
            }
        }
    }
    const currentMonth = maxDate.getMonth();
    const currentYear  = maxDate.getFullYear();

    // Determine window start
    let windowStart = new Date(currentYear, currentMonth - windowMonths, 1);

    // For each CID, get monthly net
    const totals = {}; // key: "YYYY-MM" -> total net

    for (const cid of cids) {
        if (BLOCKED_CIDS.has(cid)) continue;

        // Step 1: masterDict history
        const masterKey = Object.keys(masterDict).find(k => {
            const meta = cidGeoMap[cid];
            return meta && k === meta.Name.toLowerCase().trim().slice(0, 30);
        }) || Object.keys(masterDict).find(k => {
            const meta = cidGeoMap[cid];
            return meta && (meta.Name.toLowerCase().includes(k) || k.includes(meta.Name.toLowerCase().slice(0,10)));
        });

        if (masterKey && masterDict[masterKey]) {
            for (const [mk, val] of Object.entries(masterDict[masterKey].history)) {
                const p = parseMonthKey(mk);
                if (!p) continue;
                const dt = new Date(p.year, p.month, 1);
                if (dt < windowStart || dt.getFullYear() > currentYear || (dt.getFullYear() === currentYear && dt.getMonth() >= currentMonth)) continue;
                const key = `${p.year}-${String(p.month).padStart(2,'0')}`;
                totals[key] = (totals[key] || 0) + (cid === '4368684' ? val * 0.165 : val);
            }
        }

        // Step 2: monthlyArchive (April'26 etc — daily keys)
        if (DB.monthlyArchive && DB.monthlyArchive[cid]) {
            for (const [dk, val] of Object.entries(DB.monthlyArchive[cid])) {
                const p = dateKeyParts(dk);
                if (!p) continue;
                const dt = new Date(p.year, p.month, 1);
                if (dt < windowStart || dt.getFullYear() > currentYear || (dt.getFullYear() === currentYear && dt.getMonth() >= currentMonth)) continue;
                const key = `${p.year}-${String(p.month).padStart(2,'0')}`;
                totals[key] = (totals[key] || 0) + (cid === '4368684' ? val * 0.165 : val);
            }
        }

        // Step 3: liveRecords current month → project to full month
        if (DB.records && DB.records[cid]) {
            const netEntries = DB.records[cid].net || {};
            let monthNet = {};
            for (const [dk, val] of Object.entries(netEntries)) {
                const p = dateKeyParts(dk);
                if (!p) continue;
                const mkey = `${p.year}-${String(p.month).padStart(2,'0')}`;
                monthNet[mkey] = (monthNet[mkey] || 0) + val;
            }
            for (const [mkey, val] of Object.entries(monthNet)) {
                const [yr, mo] = mkey.split('-').map(Number);
                const dt = new Date(yr, mo, 1);
                if (dt < windowStart) continue;
                // Project current month to full month
                const daysIn = getDaysInMonth(yr, mo);
                const daysData = Object.keys(netEntries).filter(dk => {
                    const p = dateKeyParts(dk);
                    return p && p.year === yr && p.month === mo;
                }).length;
                const projected = daysData > 0 ? val * (daysIn / daysData) : val;
                const factor = cid === '4368684' ? 0.165 : 1;
                totals[mkey] = (totals[mkey] || 0) + projected * factor;
            }
        }
    }

    // Sort and return as array
    const sorted = Object.entries(totals)
        .sort(([a],[b]) => a.localeCompare(b))
        .map(([key, value]) => {
            const [yr, mo] = key.split('-').map(Number);
            return { year: yr, month: mo, value };
        });

    return { series: sorted, currentMonth, currentYear };
}

// ── FORECASTING METHODS ───────────────────────────────────────────────────────

// 1. Linear OLS trend
function linearTrend(series, horizon) {
    const n = series.length;
    if (n < 3) return null;
    const values = series.map(s => s.value);
    const xMean = (n - 1) / 2;
    const yMean = values.reduce((a,b) => a+b, 0) / n;
    let num = 0, den = 0;
    for (let i = 0; i < n; i++) {
        num += (i - xMean) * (values[i] - yMean);
        den += (i - xMean) ** 2;
    }
    const slope = den === 0 ? 0 : num / den;
    const intercept = yMean - slope * xMean;
    return intercept + slope * (n - 1 + horizon);
}

// 2. Holt's Double Exponential Smoothing (trend-aware)
function holtSmoothing(series, horizon, alpha = 0.4, beta = 0.3) {
    if (series.length < 4) return null;
    const v = series.map(s => s.value);
    let l = v[0], b = v[1] - v[0];
    for (let i = 1; i < v.length; i++) {
        const lPrev = l;
        l = alpha * v[i] + (1 - alpha) * (l + b);
        b = beta * (l - lPrev) + (1 - beta) * b;
    }
    return l + horizon * b;
}

// 3. Seasonal Naive — same month last year
function seasonalNaive(series, targetMonth, targetYear) {
    const lastYear = series.find(s => s.month === targetMonth && s.year === targetYear - 1);
    return lastYear ? lastYear.value : null;
}

// 4. 3-Month Moving Average
function movingAverage(series, k = 3) {
    if (series.length < k) return null;
    const last = series.slice(-k);
    return last.reduce((a, b) => a + b.value, 0) / k;
}

// 5. YoY growth adjusted (avg recent YoY * same month last year)
function yoyAdjusted(series, targetMonth, targetYear) {
    // Compute YoY growth for last 3 available months
    const growths = [];
    for (const s of series) {
        const prev = series.find(p => p.month === s.month && p.year === s.year - 1);
        if (prev && prev.value !== 0) growths.push((s.value - prev.value) / Math.abs(prev.value));
    }
    if (growths.length === 0) return null;
    const recentGrowths = growths.slice(-3);
    const avgGrowth = recentGrowths.reduce((a,b) => a+b, 0) / recentGrowths.length;
    const baseMonth = series.find(s => s.month === targetMonth && s.year === targetYear - 1);
    if (!baseMonth) return null;
    return baseMonth.value * (1 + avgGrowth);
}

// ── ENSEMBLE ──────────────────────────────────────────────────────────────────
function ensemble(series, targetMonth, targetYear) {
    if (series.length < 3) return null;

    const methods = [
        { name: 'Linear Trend',       short: 'OLS',      val: linearTrend(series, 1),                              weight: 0.20, desc: 'Fits a straight line to recent data' },
        { name: "Holt's Smoothing",   short: 'Holt',     val: holtSmoothing(series, 1),                            weight: 0.30, desc: 'Exponential smoothing with trend component' },
        { name: 'Seasonal Naive',     short: 'Seasonal', val: seasonalNaive(series, targetMonth, targetYear),      weight: 0.20, desc: 'Same month last year as baseline' },
        { name: '3-Month Average',    short: 'MA-3',     val: movingAverage(series, 3),                            weight: 0.15, desc: 'Average of last 3 months' },
        { name: 'YoY Adjusted',       short: 'YoY',      val: yoyAdjusted(series, targetMonth, targetYear),       weight: 0.15, desc: 'Last year × recent YoY growth rate' },
    ];

    // Normalize weights among available methods
    const valid = methods.filter(m => m.val !== null && !isNaN(m.val) && isFinite(m.val));
    if (valid.length === 0) return null;
    const totalW = valid.reduce((s, m) => s + m.weight, 0);
    const normalized = valid.map(m => ({ ...m, normWeight: m.weight / totalW }));

    const blended = normalized.reduce((s, m) => s + m.val * m.normWeight, 0);

    // Confidence: stddev of method outputs as % of mean → lower = tighter
    const vals = normalized.map(m => m.val);
    const mean = vals.reduce((a,b) => a+b, 0) / vals.length;
    const variance = vals.reduce((s, v) => s + (v - mean) ** 2, 0) / vals.length;
    const cv = mean !== 0 ? Math.sqrt(variance) / Math.abs(mean) : 1;
    const confidence = Math.max(0, Math.min(1, 1 - cv));

    // Range: ±1 std dev of method outputs
    const std = Math.sqrt(variance);
    const lo = blended - std;
    const hi = blended + std;

    return { blended, methods: normalized, confidence, lo, hi, valid };
}

// ── FILTER CIDS ──────────────────────────────────────────────────────────────
function getFilteredCIDs(geo, book) {
    const allCIDs = new Set([
        ...Object.keys(cidGeoMap),
        ...Object.keys(DB.userMappings || {}),
    ]);
    BLOCKED_CIDS.forEach(c => allCIDs.delete(c));

    return Array.from(allCIDs).filter(cid => {
        if (BLOCKED_CIDS.has(cid)) return false;
        const meta = cidGeoMap[cid] || (DB.userMappings && DB.userMappings[cid]);
        if (!meta) return false;
        if (geo !== 'All' && meta.Geo !== geo) return false;
        if (book !== 'All' && meta.Type !== book) return false;
        return true;
    });
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function fmtK(v) {
    const abs = Math.abs(v);
    const sign = v < 0 ? '-' : '';
    if (abs >= 1000000) return sign + '$' + (abs/1000000).toFixed(2) + 'M';
    if (abs >= 1000)    return sign + '$' + (abs/1000).toFixed(1) + 'K';
    return sign + '$' + abs.toFixed(0);
}
function fmtPct(v) {
    if (!isFinite(v)) return '—';
    const s = (v*100).toFixed(1) + '%';
    return v > 0 ? '+' + s : s;
}
function toTitle(s) { return String(s).replace(/\b\w/g, c => c.toUpperCase()); }
const GEO_COLORS = {
    'China': '#214295', 'India': '#5BA976', 'SEA': '#025450',
    'Korea': '#FFBE60', 'Vietnam': '#A6DDEE', 'US BD': '#6E1B35', 'APAC - Others': '#9ca3af'
};

let chartInstance = null;

// ── MAIN RUN ──────────────────────────────────────────────────────────────────
async function runForecast() {
    const btn = document.getElementById('runBtn');
    btn.disabled = true;
    document.getElementById('loadingMsg').style.display = 'block';
    document.getElementById('results').style.display = 'none';

    try {
        if (!DB) await loadData();

        const geo      = document.getElementById('geoFilter').value;
        const book     = document.getElementById('bookFilter').value;
        const window_  = parseInt(document.getElementById('windowFilter').value);
        const horizon  = parseInt(document.getElementById('horizonFilter').value);

        const cids = getFilteredCIDs(geo, book);
        const { series, currentMonth, currentYear } = buildTimeSeries(cids, window_);

        if (series.length < 3) {
            document.getElementById('loadingMsg').textContent = 'Insufficient data for this filter combination.';
            btn.disabled = false; return;
        }

        // Target month(s)
        const targets = [];
        for (let h = 1; h <= horizon; h++) {
            let tMonth = currentMonth + h;
            let tYear  = currentYear;
            if (tMonth > 11) { tMonth -= 12; tYear++; }
            targets.push({ month: tMonth, year: tYear });
        }

        // Primary forecast (next month)
        const primary = ensemble(series, targets[0].month, targets[0].year);
        if (!primary) {
            document.getElementById('loadingMsg').textContent = 'Could not compute forecast — not enough history.';
            btn.disabled = false; return;
        }

        // Last known actual
        const lastActual = series[series.length - 1];
        const momChange  = lastActual ? (primary.blended - lastActual.value) / Math.abs(lastActual.value) : null;

        // YoY
        const sameLastYear = series.find(s => s.month === targets[0].month && s.year === targets[0].year - 1);
        const yoyChange    = sameLastYear ? (primary.blended - sameLastYear.value) / Math.abs(sameLastYear.value) : null;

        // Per-geo breakdown
        const geos = ['China','India','SEA','Korea','Vietnam','US BD','APAC - Others'];
        const geoForecasts = [];
        if (geo === 'All') {
            for (const g of geos) {
                const gCIDs = getFilteredCIDs(g, book);
                if (gCIDs.length === 0) continue;
                const { series: gs } = buildTimeSeries(gCIDs, window_);
                if (gs.length < 3) continue;
                const gf = ensemble(gs, targets[0].month, targets[0].year);
                if (!gf) continue;
                const gLast = gs[gs.length - 1];
                geoForecasts.push({ geo: g, forecast: gf, last: gLast });
            }
        }

        // Per-account top-10 by forecast value
        const acctForecasts = [];
        for (const cid of cids) {
            const meta = cidGeoMap[cid] || (DB.userMappings && DB.userMappings[cid]);
            if (!meta) continue;
            const { series: as } = buildTimeSeries([cid], window_);
            if (as.length < 3) continue;
            const af = ensemble(as, targets[0].month, targets[0].year);
            if (!af || af.blended <= 0) continue;
            const aLast = as[as.length - 1];
            acctForecasts.push({ cid, name: meta.Name, geo: meta.Geo, forecast: af, last: aLast });
        }
        acctForecasts.sort((a,b) => b.forecast.blended - a.forecast.blended);

        // Multi-horizon for chart
        const chartForecasts = [];
        for (const t of targets) {
            const f = ensemble(series, t.month, t.year);
            chartForecasts.push({ ...t, forecast: f });
        }

        renderResults({ primary, series, targets, chartForecasts, geoForecasts, acctForecasts, momChange, yoyChange, sameLastYear, lastActual, geo, book, window_ });

    } catch(e) {
        document.getElementById('loadingMsg').textContent = 'Error: ' + e.message;
        console.error(e);
    }

    btn.disabled = false;
    document.getElementById('loadingMsg').style.display = 'none';
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderResults({ primary, series, targets, chartForecasts, geoForecasts, acctForecasts, momChange, yoyChange, sameLastYear, lastActual, geo, book, window_ }) {
    const tgt = targets[0];
    const tgtLabel = `${MONTH_NAMES[tgt.month]} ${tgt.year}`;
    const bestMethod = primary.methods.reduce((a,b) => a.normWeight > b.normWeight ? a : b);

    const deltaUp = v => v > 0 ? `<span class="delta-up">▲ ${fmtPct(v)}</span>` : v < 0 ? `<span class="delta-dn">▼ ${fmtPct(Math.abs(v))}</span>` : '—';

    // Hero
    let heroHTML = `
    <div class="forecast-hero fade-in">
        <div class="hero-cell primary">
            <div class="hero-label">Forecast · ${tgtLabel}</div>
            <div class="hero-value tnum">${fmtK(primary.blended)}</div>
            <div class="hero-sub">Range: ${fmtK(primary.lo)} – ${fmtK(primary.hi)}</div>
            <div class="hero-method">Ensemble · ${primary.valid.length} methods blended</div>
        </div>
        <div class="hero-cell">
            <div class="hero-label">vs Last Month</div>
            <div class="hero-value tnum">${momChange !== null ? deltaUp(momChange) : '—'}</div>
            <div class="hero-sub">${lastActual ? 'Actual ' + MONTH_NAMES[lastActual.month] + ': ' + fmtK(lastActual.value) : ''}</div>
        </div>
        <div class="hero-cell">
            <div class="hero-label">vs Same Month LY</div>
            <div class="hero-value tnum">${yoyChange !== null ? deltaUp(yoyChange) : '—'}</div>
            <div class="hero-sub">${sameLastYear ? MONTH_NAMES[sameLastYear.month] + ' ' + sameLastYear.year + ': ' + fmtK(sameLastYear.value) : 'No prior year data'}</div>
        </div>
        <div class="hero-cell">
            <div class="hero-label">Model Confidence</div>
            <div class="hero-value tnum">${(primary.confidence * 100).toFixed(0)}%</div>
            <div class="hero-sub">${primary.confidence > 0.75 ? 'High agreement across methods' : primary.confidence > 0.5 ? 'Moderate method divergence' : 'Methods diverge — wide range'}</div>
        </div>
    </div>`;

    // Method breakdown
    const maxVal = Math.max(...primary.methods.map(m => Math.abs(m.val)));
    const methodRows = primary.methods.map(m => {
        const pct = maxVal > 0 ? (Math.abs(m.val) / maxVal * 100) : 0;
        const isBest = m.name === bestMethod.name;
        return `<div class="method-row ${isBest ? 'best' : ''}">
            <div>
                <div class="method-name">${m.name} ${isBest ? '★' : ''}</div>
                <div class="method-desc">${m.desc}</div>
            </div>
            <div>
                <div class="method-bar-wrap"><div class="method-bar" style="width:${pct}%"></div></div>
            </div>
            <div class="method-val tnum">${fmtK(m.val)}</div>
            <div class="method-weight">${(m.normWeight*100).toFixed(0)}% wt</div>
        </div>`;
    }).join('');

    // Geo table
    let geoTableHTML = '';
    if (geoForecasts.length > 0) {
        const geoRows = geoForecasts.sort((a,b) => b.forecast.blended - a.forecast.blended).map(g => {
            const share = primary.blended > 0 ? g.forecast.blended / primary.blended : 0;
            const gMom = g.last ? (g.forecast.blended - g.last.value) / Math.abs(g.last.value) : null;
            return `<tr>
                <td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${GEO_COLORS[g.geo]||'#9ca3af'};margin-right:8px"></span>${g.geo}</td>
                <td class="tnum">${fmtK(g.forecast.blended)}</td>
                <td class="tnum">${gMom !== null ? (gMom > 0 ? '<span class="delta-up">▲ ' : '<span class="delta-dn">▼ ') + fmtPct(Math.abs(gMom)) + '</span>' : '—'}</td>
                <td class="tnum">${(g.forecast.confidence * 100).toFixed(0)}%</td>
                <td class="tnum">${(share * 100).toFixed(1)}%</td>
            </tr>`;
        }).join('');
        geoTableHTML = `
        <div class="full-col fade-in" style="animation-delay:.15s">
            <div class="section-card">
                <div class="section-title">Geo Breakdown</div>
                <div class="section-sub">Forecast by market segment — ${tgtLabel}</div>
                <table class="geo-table">
                    <thead><tr>
                        <th style="text-align:left">Market</th>
                        <th>Forecast</th>
                        <th>vs Last Mo</th>
                        <th>Confidence</th>
                        <th>Portfolio Share</th>
                    </tr></thead>
                    <tbody>${geoRows}</tbody>
                </table>
            </div>
        </div>`;
    }

    // Chart data — history + forecast
    const chartLabels = series.map(s => `${MONTH_NAMES[s.month].slice(0,3)} ${String(s.year).slice(-2)}`);
    const chartValues = series.map(s => s.value);

    // Add forecast points
    const fcLabels = chartForecasts.map(f => `${MONTH_NAMES[f.month].slice(0,3)} ${String(f.year).slice(-2)}`);
    const fcValues = chartForecasts.map(f => f.forecast ? f.forecast.blended : null);
    const fcLo     = chartForecasts.map(f => f.forecast ? f.forecast.lo : null);
    const fcHi     = chartForecasts.map(f => f.forecast ? f.forecast.hi : null);

    // Account table
    const acctRows = acctForecasts.slice(0, 15).map((a, i) => {
        const aMom = a.last ? (a.forecast.blended - a.last.value) / Math.abs(a.last.value) : null;
        const pillClass = aMom === null ? 'pill-neu' : aMom > 0.05 ? 'pill-up' : aMom < -0.05 ? 'pill-dn' : 'pill-neu';
        const pillText  = aMom === null ? '—' : fmtPct(aMom);
        return `<tr>
            <td>${i+1}. ${toTitle(a.name).slice(0,28)}</td>
            <td><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${GEO_COLORS[a.geo]||'#9ca3af'};margin-right:5px;vertical-align:middle"></span>${a.geo}</td>
            <td class="tnum">${fmtK(a.forecast.blended)}</td>
            <td class="tnum">${a.last ? fmtK(a.last.value) : '—'}</td>
            <td><span class="pill ${pillClass}">${pillText}</span></td>
            <td class="tnum">${(a.forecast.confidence*100).toFixed(0)}%</td>
        </tr>`;
    }).join('');

    // Assumptions
    const assumptionsHTML = `
        <ul class="assumption-list">
            <li><strong>History window:</strong> Last ${window_} months of actuals used for all models.</li>
            <li><strong>Current month projection:</strong> MTD actuals are scaled to full-month equivalent using days elapsed vs days in month.</li>
            <li><strong>Trip.com:</strong> Applies 16.5% revenue-share factor consistently across all periods.</li>
            <li><strong>IHG accounts (4386835, 4390377):</strong> Permanently excluded from all calculations.</li>
            <li><strong>Ensemble blend:</strong> Holt's 30% · Linear Trend 20% · Seasonal Naive 20% · MA-3 15% · YoY Adjusted 15% — weights renormalized if a method lacks data.</li>
            <li><strong>Confidence score:</strong> Derived from coefficient of variation across method outputs. Above 75% = methods largely agree.</li>
            <li><strong>Range (Lo–Hi):</strong> Blended forecast ± one standard deviation across individual method outputs.</li>
        </ul>`;

    const html = `
        ${heroHTML}
        <div class="two-col fade-in" style="animation-delay:.08s">
            <div class="section-card">
                <div class="section-title">Ensemble Method Breakdown</div>
                <div class="section-sub">How each model contributes to the blended forecast</div>
                <div class="method-grid">${methodRows}</div>
            </div>
            <div class="section-card">
                <div class="section-title">Historical Trend + Forecast</div>
                <div class="section-sub">Actuals (solid) · Forecast (dashed) · Range (shaded)</div>
                <div class="chart-wrap"><canvas id="forecastChart"></canvas></div>
            </div>
        </div>
        ${geoTableHTML}
        <div class="full-col fade-in" style="animation-delay:.22s">
            <div class="section-card">
                <div class="section-title">Top Accounts — Forecast Ranking</div>
                <div class="section-sub">Sorted by projected ${tgtLabel} net fee · Top 15</div>
                <table class="acct-table">
                    <thead><tr>
                        <th style="text-align:left">Account</th>
                        <th style="text-align:left">Geo</th>
                        <th>Forecast</th>
                        <th>Last Actual</th>
                        <th>MoM</th>
                        <th>Confidence</th>
                    </tr></thead>
                    <tbody>${acctRows}</tbody>
                </table>
            </div>
        </div>
        <div class="full-col fade-in" style="animation-delay:.3s">
            <div class="section-card">
                <div class="section-title">Model Assumptions</div>
                <div class="section-sub">Methodology notes for this forecast run</div>
                ${assumptionsHTML}
            </div>
        </div>`;

    const resultsEl = document.getElementById('results');
    resultsEl.innerHTML = html;
    resultsEl.style.display = 'block';

    // Draw chart after DOM is ready
    requestAnimationFrame(() => {
        if (chartInstance) chartInstance.destroy();
        Chart.defaults.font.family = '"DM Sans", sans-serif';
        const ctx = document.getElementById('forecastChart');
        if (!ctx) return;

        const allLabels = [...chartLabels, ...fcLabels];
        const histLen   = chartLabels.length;

        // Build actuals dataset (null for forecast months)
        const actData = [...chartValues, ...fcValues.map(() => null)];
        // Build forecast dataset (null for history, first value = last actual as bridge)
        const fcData  = [...chartValues.map(() => null), ...fcValues];
        fcData[histLen - 1] = chartValues[chartValues.length - 1]; // bridge

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: allLabels,
                datasets: [
                    {
                        label: 'Actuals',
                        data: actData,
                        borderColor: '#214295',
                        backgroundColor: 'rgba(33,66,149,0.06)',
                        fill: true,
                        tension: 0.25,
                        borderWidth: 2.5,
                        pointRadius: 3,
                        pointBackgroundColor: '#214295',
                    },
                    {
                        label: 'Forecast',
                        data: fcData,
                        borderColor: '#5BA976',
                        backgroundColor: 'transparent',
                        borderDash: [6, 4],
                        tension: 0.25,
                        borderWidth: 2.5,
                        pointRadius: 5,
                        pointBackgroundColor: '#5BA976',
                        pointStyle: 'rectRot',
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { position: 'top', align: 'end', labels: { usePointStyle: true, boxWidth: 8 } },
                    tooltip: {
                        backgroundColor: '#191919',
                        titleFont: { family: 'Fraunces', size: 13 },
                        padding: 12,
                        callbacks: {
                            label: c => `${c.dataset.label}: ${c.raw !== null ? fmtK(c.raw) : '—'}`
                        }
                    }
                },
                scales: {
                    x: { grid: { display: false }, ticks: { maxTicksLimit: 12, font: { size: 10 } } },
                    y: { grid: { color: '#e5e7eb' }, ticks: { callback: v => fmtK(v), font: { size: 10 } } }
                }
            }
        });
    });
}

// ── INIT ──────────────────────────────────────────────────────────────────────
(async () => {
    try {
        document.getElementById('loadingMsg').style.display = 'block';
        document.getElementById('loadingMsg').textContent = 'Loading data…';
        await loadData();
        document.getElementById('loadingMsg').style.display = 'none';
        runForecast();
    } catch(e) {
        document.getElementById('loadingMsg').textContent = 'Could not load data: ' + e.message;
    }
})();
</script>
