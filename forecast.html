// ── HELPERS ───────────────────────────────────────────────────────────────────
function fmtK(v) {
  if (!isFinite(v)) return '—';
  const a=Math.abs(v), s=v<0?'-':'';
  return a>=1e6 ? s+'$'+(a/1e6).toFixed(2)+'M' : a>=1e3 ? s+'$'+(a/1e3).toFixed(1)+'K' : s+'$'+a.toFixed(0);
}
function fmtPct(v) {
  if (!isFinite(v)) return '—';
  const s=(Math.abs(v)*100).toFixed(1)+'%';
  return v>0?'+'+s:v<0?'-'+s:s;
}
function dUp(v) { return v>0?`<span class="up">▲ ${fmtPct(v)}</span>`:v<0?`<span class="dn">▼ ${fmtPct(v)}</span>`:'—'; }
function dInM(y,m) { return new Date(y,m+1,0).getDate(); }
function status(msg, isErr) {
  const el=document.getElementById('statusMsg');
  el.textContent=msg; el.style.display=msg?'block':'none';
  el.className=isErr?'error':'';
}

// ── DATE PARSING ──────────────────────────────────────────────────────────────
function parseDK(k) { // "1-May-26" → {month,year}
  const m=String(k).match(/^(\d{1,2})-([A-Za-z]{3,4})-(\d{2,4})$/);
  if (!m) return null;
  let yr=m[3]; if(yr.length===2) yr='20'+yr;
  const idx=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
    .findIndex(x=>m[2].toLowerCase()===x.toLowerCase());
  return idx>=0?{month:idx,year:parseInt(yr)}:null;
}
function parseMK(k) { // "April'26" → {month,year}
  const m=String(k).match(/^([A-Za-z]+)'(\d{2})$/);
  if (!m) return null;
  const mo=MK_MAP[m[1]];
  return mo!==undefined?{month:mo,year:2000+parseInt(m[2])}:null;
}

// ── DATA LOAD ─────────────────────────────────────────────────────────────────
async function loadData() {
  const url=`https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${GH_FILE}?t=${Date.now()}`;
  const r=await fetch(url); if(!r.ok) throw new Error('Cannot load latest.json');
  DB=await r.json();
  BLOCKED.forEach(c=>{
    delete DB.records?.[c]; delete DB.monthlyArchive?.[c]; delete DB.userMappings?.[c];
  });
  document.getElementById('dataTag').textContent='Data through '+(DB.lastUpdated||'—');
}

// ── SERIES BUILDER ────────────────────────────────────────────────────────────
function buildSeries(cids, winMonths) {
  // Find max date in liveRecords
  let maxM=0, maxY=2026;
  for (const cid of Object.keys(DB.records||{})) {
    for (const k of Object.keys(DB.records[cid].net||{})) {
      const p=parseDK(k); if(!p) continue;
      if(p.year>maxY||(p.year===maxY&&p.month>maxM)){maxY=p.year;maxM=p.month;}
    }
  }
  const winStart=new Date(maxY, maxM-winMonths, 1);

    if (mdKey) {
      for (const [mk,val] of Object.entries(MD[mdKey].history)) {
        const p=parseMK(mk); if(!p) continue;
        if(new Date(p.year,p.month,1)<winStart) continue;
        if(p.year===maxY && p.month>maxM) continue; // future only
        const key=`${p.year}-${String(p.month).padStart(2,'0')}`;
        totals[key]=(totals[key]||0)+val*factor;
      }
    }

    for (const [mk,val] of Object.entries(DB.monthlyArchive?.[cid]||{})) {
      const p=parseMK(mk); if(!p) continue;
      if(new Date(p.year,p.month,1)<winStart) continue;
      if(p.year===maxY && p.month>maxM) continue;
      const key=`${p.year}-${String(p.month).padStart(2,'0')}`;
      totals[key]=(totals[key]||0)+val*factor;
    }

    // 3. liveRecords — current month only, projected via day1-isolation
    const netEntries=DB.records?.[cid]?.net||{};
    let day1=0, rest=[];
    for (const [dk,val] of Object.entries(netEntries)) {
      const p=parseDK(dk); if(!p) continue;
      if(p.year!==maxY||p.month!==maxM) continue;
      parseInt(dk.split('-')[0])===1 ? day1+=val : rest.push(val);
    }
    if(day1!==0||rest.length>0) {
      const daysInMo=dInM(maxY,maxM);
      const proj = rest.length>0 ? day1+(rest.reduce((a,b)=>a+b,0)/rest.length)*(daysInMo-1) : day1;
      const mkey=`${maxY}-${String(maxM).padStart(2,'0')}`;
      totals[mkey]=(totals[mkey]||0)+proj*factor;
    }
  }

  const series=Object.entries(totals)
    .sort(([a],[b])=>a.localeCompare(b))
    .map(([k,v])=>{const[yr,mo]=k.split('-').map(Number);return{year:yr,month:mo,value:v};});

  return {series, maxM, maxY};
}

// ── FORECASTING ───────────────────────────────────────────────────────────────
function safeVal(v) { return (v!==null&&isFinite(v))?v:null; }

function wMA(s,k=3) { // geometrically weighted moving average
  if(!s.length) return null;
  k=Math.min(k,s.length);
  const r=s.slice(-k).map(x=>x.value);
  let wSum=0,tot=0;
  for(let i=0;i<r.length;i++){const w=Math.pow(2,i);tot+=r[i]*w;wSum+=w;}
  return safeVal(tot/wSum);
}

function dampedHolt(s,a=0.4,b=0.2,phi=0.85) {
  if(s.length<4) return null;
  const v=s.map(x=>x.value);
  let l=v[0],tr=v[1]-v[0];
  for(let i=1;i<v.length;i++){const lp=l;l=a*v[i]+(1-a)*(l+phi*tr);tr=b*(l-lp)+(1-b)*phi*tr;}
  return safeVal(l+phi*tr);
}

function trimmedMean(s,k=6) {
  if(s.length<2) return null;
  const r=[...s.slice(-k).map(x=>x.value)].sort((a,b)=>a-b);
  const t=r.length>4?r.slice(1,-1):r;
  return safeVal(t.reduce((a,b)=>a+b,0)/t.length);
}

function cappedLinear(s) {
  if(s.length<4) return null;
  const r=s.slice(-8); const n=r.length;
  const v=r.map(x=>x.value);
  const xm=(n-1)/2, ym=v.reduce((a,b)=>a+b,0)/n;
  const num=v.reduce((s,vi,i)=>s+(i-xm)*(vi-ym),0);
  const den=v.reduce((s,_,i)=>s+(i-xm)**2,0);
  const slope=den?num/den:0;
  const pred=ym+slope*(n-1+1-xm);
  const last=v[v.length-1];
  if(!last) return safeVal(pred);
  return safeVal(Math.min(last*1.2,Math.max(last*0.8,pred)));
}

function detectRegime(s) {
  if(s.length<4) return 'plateau';
  const r=s.slice(-6).map(x=>x.value), n=r.length;
  const m3=r.slice(-3).reduce((a,b)=>a+b,0)/3;
  const s3=Math.sqrt(r.slice(-3).reduce((a,v)=>a+(v-m3)**2,0)/3);
  const cv=m3!==0?s3/Math.abs(m3):1;
  const m6=r.reduce((a,b)=>a+b,0)/n, xm=(n-1)/2;
  const num=r.reduce((s,v,i)=>s+(i-xm)*(v-m6),0), den=r.reduce((s,_,i)=>s+(i-xm)**2,0);
  const slope=den?num/den:0, pct=m6!==0?slope/Math.abs(m6):0;
  if(cv<0.15&&Math.abs(pct)<0.08) return 'plateau';
  return pct>0.08?'growth':'decline';
}

function forecast(s, tgtMonth) {
  if(s.length<2) return null;
  const regime=detectRegime(s);
  const methods={
    plateau:[{name:'Weighted MA',val:wMA(s,3),w:0.60,desc:'Last 3 months geometrically weighted'},{name:'Damped Trend',val:dampedHolt(s),w:0.25,desc:"Holt's with φ=0.85 damping"},{name:'Trimmed Mean',val:trimmedMean(s,6),w:0.15,desc:'Last 6 months, outliers removed'}],
    growth: [{name:'Damped Trend',val:dampedHolt(s),w:0.40,desc:"Holt's with damping"},{name:'Weighted MA',val:wMA(s,3),w:0.35,desc:'Recent momentum anchor'},{name:'Capped Linear',val:cappedLinear(s),w:0.25,desc:'OLS capped at ±20% MoM'}],
    decline:[{name:'Weighted MA',val:wMA(s,3),w:0.55,desc:'Recent actuals — decline anchor'},{name:'Damped Trend',val:dampedHolt(s),w:0.30,desc:'Trend with damping'},{name:'Trimmed Mean',val:trimmedMean(s,6),w:0.15,desc:'Last 6 months, spike-filtered'}],
  };
  // Floor individual method values at 0 — prevents one negative outlier dragging blend below zero
  const valid=(methods[regime]||methods.plateau).filter(m=>m.val!==null).map(m=>({...m,val:Math.max(0,m.val)}));
  const totalW=valid.reduce((s,m)=>s+m.w,0);
  let raw = totalW>0 ? valid.reduce((s,m)=>s+m.val*(m.w/totalW),0) : (wMA(s,Math.min(3,s.length))||0);
  if(regime==='decline') raw=Math.max(0,raw);
  const normMethods=valid.map(m=>({...m,normW:totalW>0?m.w/totalW:0}));

  // Seasonal factor — bounded ±15%, only if meaningful
  let sFactor=null, sApplied=false;
  const pairs=s.filter(x=>x.month===tgtMonth).map(x=>{
    const prev=s.find(p=>p.month===tgtMonth&&p.year===x.year-1);
    return (prev&&prev.value!==0)?x.value/prev.value:null;
  }).filter(x=>x!==null);
  if(pairs.length>0){
    const avgR=pairs.reduce((a,b)=>a+b,0)/pairs.length;
    sFactor=Math.min(1.15,Math.max(0.85,avgR));
    if(Math.abs(sFactor-1)>0.03){raw=raw*sFactor;sApplied=true;}
  }

  let fc=isFinite(raw)?raw:(wMA(s,Math.min(3,s.length))||0);
  fc=Math.max(0,fc);
  const vals=valid.map(m=>m.val);
  const meanV=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:fc;
  const varV=vals.length?vals.reduce((s,v)=>s+(v-meanV)**2,0)/vals.length:0;
  const std=Math.sqrt(varV);
  const cv=meanV!==0?std/Math.abs(meanV):1;
  const conf=Math.max(0.3,Math.min(0.98,1-cv));
  return {fc,regime,methods:normMethods,conf,lo:Math.max(0,fc-std),hi:fc+std,sApplied,sFactor};
}

// ── FILTER ────────────────────────────────────────────────────────────────────
function getCIDs(geo,book) {
  return Object.keys(CID_MAP).filter(cid=>{
    if(BLOCKED.has(cid)) return false;
    const m=CID_MAP[cid];
    if(geo!=='All'&&m.Geo!==geo) return false;
    if(book!=='All'&&m.Type!==book) return false;
    return true;
  });
}

// ── MAIN ──────────────────────────────────────────────────────────────────────
async function runForecast() {
  const btn=document.getElementById('runBtn');
  btn.disabled=true;
  status('Computing forecast…');
  document.getElementById('results').innerHTML='';

  try {
    if(!DB) await loadData();

    const geo=document.getElementById('geoFilter').value;
    const book=document.getElementById('bookFilter').value;
    const win=parseInt(document.getElementById('windowFilter').value);

    const cids=getCIDs(geo,book);
    const {series,maxM,maxY}=buildSeries(cids,win);

    if(series.length<3){
      status('Not enough history — try widening the window or changing filters.',true);
      btn.disabled=false; return;
    }

    // Target month
    let tM=maxM+1, tY=maxY;
    if(tM>11){tM=0;tY++;}
    const tgtLabel=`${MONTH_NAMES[tM]} ${tY}`;

    // Portfolio forecast
    const res=forecast(series,tM);
    if(!res){status('Could not compute — insufficient data.',true);btn.disabled=false;return;}

    const curMonth=series[series.length-1]; // projected current month (May)
    const prevFull=series.length>=2?series[series.length-2]:null; // last completed (April)
    const momChange=curMonth&&curMonth.value!==0?(res.fc-curMonth.value)/Math.abs(curMonth.value):null;
    const lyMonth=series.find(s=>s.month===tM&&s.year===tY-1);
    const yoyChange=lyMonth&&lyMonth.value!==0?(res.fc-lyMonth.value)/Math.abs(lyMonth.value):null;

    // Geo breakdowns
    const geoBreaks=[];
    if(geo==='All'){
      for(const g of ['China','India','SEA','Korea','Vietnam','US BD','APAC - Others']){
        const gc=getCIDs(g,book); if(!gc.length) continue;
        const {series:gs}=buildSeries(gc,win); if(gs.length<2) continue;
        const gf=forecast(gs,tM); if(!gf) continue;
        const gLast=gs[gs.length-1];
        const gMom=gLast&&gLast.value!==0?(gf.fc-gLast.value)/Math.abs(gLast.value):null;
        geoBreaks.push({geo:g,fc:Math.max(0,gf.fc),regime:gf.regime,conf:gf.conf,mom:gMom});
      }
    }

    // Account forecasts
    const acctFc=[];
    let nP=0,nG=0,nD=0,nT=0;
    for(const cid of cids){
      const m=CID_MAP[cid]; if(!m) continue;
      const {series:as}=buildSeries([cid],win); if(as.length<2) continue;
      const af=forecast(as,tM); if(!af) continue;
      nT++; if(af.regime==='plateau')nP++;else if(af.regime==='growth')nG++;else nD++;
      if(af.fc>50) acctFc.push({cid,name:m.Name,geo:m.Geo,fc:af.fc,last:as[as.length-1],regime:af.regime,mom:as.length>=2&&as[as.length-1].value!==0?(af.fc-as[as.length-1].value)/Math.abs(as[as.length-1].value):null});
    }
    acctFc.sort((a,b)=>b.fc-a.fc);

    status('');
    render({res,series,tM,tY,tgtLabel,curMonth,momChange,yoyChange,lyMonth,geoBreaks,acctFc,nP,nG,nD,nT,win,maxM,maxY});

  } catch(e) {
    status('Error: '+e.message,true);
    console.error(e);
  }
  btn.disabled=false;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render({res,series,tM,tY,tgtLabel,curMonth,momChange,yoyChange,lyMonth,geoBreaks,acctFc,nP,nG,nD,nT,win,maxM,maxY}) {
  const rLbl=res.regime.charAt(0).toUpperCase()+res.regime.slice(1);

  // Hero
  const heroHTML=`
  <div class="hero fade">
    <div class="hero-cell primary">
      <div class="hero-label">Forecast · ${tgtLabel}</div>
      <div class="hero-val tnum">${fmtK(res.fc)}</div>
      <div class="hero-sub">Range: ${fmtK(res.lo)} – ${fmtK(res.hi)}</div>
      <span class="badge b-${res.regime}">${rLbl} regime</span>
    </div>
    <div class="hero-cell">
      <div class="hero-label">vs ${curMonth?MONTH_NAMES[curMonth.month]+' (Projected)':'Last Month'}</div>
      <div class="hero-val tnum">${momChange!==null?dUp(momChange):'—'}</div>
      <div class="hero-sub">${curMonth?MONTH_NAMES[curMonth.month].slice(0,3)+' projected: '+fmtK(curMonth.value):''}</div>
    </div>
    <div class="hero-cell">
      <div class="hero-label">vs Same Month LY</div>
      <div class="hero-val tnum">${yoyChange!==null?dUp(yoyChange):'—'}</div>
      <div class="hero-sub">${lyMonth?MONTH_NAMES[lyMonth.month].slice(0,3)+' '+lyMonth.year+': '+fmtK(lyMonth.value):'No prior year data'}</div>
    </div>
    <div class="hero-cell">
      <div class="hero-label">Model Confidence</div>
      <div class="hero-val tnum">${(res.conf*100).toFixed(0)}%</div>
      <div class="hero-sub">${res.sApplied?'Seasonal adj ×'+res.sFactor.toFixed(2)+' applied':'No seasonal adj'}</div>
    </div>
  </div>`;

  // Methods
  const maxV=Math.max(...res.methods.map(m=>Math.abs(m.val)));
  const methodHTML=res.methods.map(m=>`
  <div class="method-row">
    <div><div class="method-name">${m.name}</div><div class="method-desc">${m.desc}</div></div>
    <div><div class="mbar-wrap"><div class="mbar" style="width:${maxV>0?(Math.abs(m.val)/maxV*100):0}%"></div></div></div>
    <div class="method-val tnum">${fmtK(m.val)}</div>
  </div>`).join('');

  // Regime bar
  const pG=nT?(nG/nT*100).toFixed(0):0, pP=nT?(nP/nT*100).toFixed(0):0, pD=nT?(nD/nT*100).toFixed(0):0;
  const regimeBarHTML=`
  <div class="regime-bar">
    <div class="regime-seg" style="width:${pG}%;background:#214295" title="Growth: ${nG}">${pG>8?pG+'% Growth':''}</div>
    <div class="regime-seg" style="width:${pP}%;background:#5BA976" title="Plateau: ${nP}">${pP>8?pP+'% Plateau':''}</div>
    <div class="regime-seg" style="width:${pD}%;background:#6E1B35" title="Decline: ${nD}">${pD>8?pD+'% Decline':''}</div>
  </div>
  <div style="display:flex;gap:16px;font-size:11px;color:#6b7280">
    <span style="color:#214295;font-weight:700">■</span> Growth: ${nG}
    <span style="color:#5BA976;font-weight:700">■</span> Plateau: ${nP}
    <span style="color:#6E1B35;font-weight:700">■</span> Decline: ${nD}
  </div>`;

  // Geo table
  const geoRows=geoBreaks.sort((a,b)=>b.fc-a.fc).map(g=>`<tr>
    <td><span class="dot" style="background:${GEO_COLORS[g.geo]||'#9ca3af'}"></span>${g.geo}</td>
    <td class="tnum">${fmtK(g.fc)}</td>
    <td>${g.mom!==null?dUp(g.mom):'—'}</td>
    <td><span class="pill pill-${g.regime}">${g.regime}</span></td>
    <td class="tnum">${(g.conf*100).toFixed(0)}%</td>
    <td class="tnum">${res.fc>0?(g.fc/res.fc*100).toFixed(1)+'%':'—'}</td>
  </tr>`).join('');

  // Account table
  const acctRows=acctFc.slice(0,15).map((a,i)=>{
    const pCls=a.mom===null?'pill-neu':a.mom>0.05?'pill-up':a.mom<-0.05?'pill-dn':'pill-neu';
    return `<tr>
      <td>${i+1}. ${a.name.slice(0,28)}</td>
      <td><span class="dot" style="background:${GEO_COLORS[a.geo]||'#9ca3af'}"></span>${a.geo}</td>
      <td class="tnum">${fmtK(a.fc)}</td>
      <td class="tnum">${a.last?fmtK(a.last.value):'—'}</td>
      <td><span class="pill ${pCls}">${a.mom!==null?fmtPct(a.mom):'—'}</span></td>
      <td><span class="pill pill-${a.regime}">${a.regime}</span></td>
    </tr>`;}).join('');

  // Chart
  const labels=series.map(s=>`${MONTH_SHORT[s.month]} '${String(s.year).slice(-2)}`);
  const vals=series.map(s=>s.value);
  const tgtLbl=`${MONTH_SHORT[tM]} '${String(tY).slice(-2)}`;
  const fcData=[...vals.map(()=>null),res.fc];
  fcData[vals.length-1]=vals[vals.length-1];

  const html=`
  ${heroHTML}
  <div class="two fade">
    <div class="card">
      <div class="card-title">Portfolio Regime Mix</div>
      <div class="card-sub">${win}-month window · ${nT} accounts classified</div>
      ${regimeBarHTML}
      <div style="margin-top:20px">
        <div class="card-title" style="font-size:15px;margin-bottom:4px">Active: ${rLbl} Regime</div>
        <div class="card-sub">Method weights for this forecast</div>
        ${methodHTML}
      </div>
    </div>
    <div class="card">
      <div class="card-title">Historical Trend + Forecast</div>
      <div class="card-sub">Actuals (blue) · Forecast (green ◆)</div>
      <div class="chart-wrap"><canvas id="fc-chart"></canvas></div>
    </div>
  </div>
  ${geoBreaks.length?`
  <div class="card fade">
    <div class="card-title">Geo Breakdown</div>
    <div class="card-sub">Per-market forecast · ${tgtLabel}</div>
    <table><thead><tr><th style="text-align:left">Market</th><th>Forecast</th><th>vs May Proj</th><th>Regime</th><th>Confidence</th><th>Share</th></tr></thead>
    <tbody>${geoRows}</tbody></table>
  </div>`:''}
  <div class="card fade">
    <div class="card-title">Top Accounts — Forecast Ranking</div>
    <div class="card-sub">Sorted by projected ${tgtLabel} net fee · Top 15</div>
    <table><thead><tr><th style="text-align:left">Account</th><th style="text-align:left">Geo</th><th>Forecast</th><th>Last Actual</th><th>MoM</th><th>Regime</th></tr></thead>
    <tbody>${acctRows}</tbody></table>
  </div>
  <div class="card fade">
    <div class="card-title">Methodology</div>
    <div class="card-sub">How this forecast was built</div>
    <ul class="assume-list">
      <li><strong>Regime detection:</strong> Each account classified as Plateau (CV&lt;15%, slope&lt;8%), Growth, or Decline from last 6 months.</li>
      <li><strong>Plateau (${nP} accounts):</strong> Weighted MA 60% + Damped Holt 25% + Trimmed Mean 15%.</li>
      <li><strong>Growth (${nG} accounts):</strong> Damped Holt 40% + Weighted MA 35% + Capped Linear (±20%) 25%.</li>
      <li><strong>Decline (${nD} accounts):</strong> Weighted MA 55% + Damped Holt 30% + Trimmed Mean 15%. Floor at zero.</li>
      <li><strong>Current month projection:</strong> Day 1 fixed fees treated as one-time; daily run rate from days 2–N projected over remaining days.</li>
      <li><strong>Seasonal factor:</strong> Applied only if prior-year data exists and ratio deviates &gt;3% from 1.0. Capped at ±15%.</li>
      <li><strong>Trip.com:</strong> 16.5% revenue-share factor applied throughout. IHG accounts permanently excluded.</li>
    </ul>
  </div>`;

  document.getElementById('results').innerHTML=html;

  // Draw chart
  requestAnimationFrame(()=>{
    if(chartInst) chartInst.destroy();
    Chart.defaults.font.family='"DM Sans",sans-serif';
    const ctx=document.getElementById('fc-chart');
    if(!ctx) return;
    chartInst=new Chart(ctx,{type:'line',data:{
      labels:[...labels,tgtLbl],
      datasets:[
        {label:'Actuals',data:[...vals,null],borderColor:'#214295',backgroundColor:'rgba(33,66,149,.07)',fill:true,tension:.25,borderWidth:2.5,pointRadius:2,pointBackgroundColor:'#214295'},
        {label:'Forecast',data:fcData,borderColor:'#5BA976',backgroundColor:'transparent',borderDash:[5,4],tension:.25,borderWidth:2.5,pointRadius:[...vals.map(()=>0),6],pointStyle:'rectRot',pointBackgroundColor:'#5BA976'},
      ]
    },options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{position:'top',align:'end',labels:{usePointStyle:true,boxWidth:8}},
        tooltip:{backgroundColor:'#191919',padding:12,callbacks:{label:c=>`${c.dataset.label}: ${c.raw!==null?fmtK(c.raw):'—'}`}}
      },
      scales:{x:{grid:{display:false},ticks:{maxTicksLimit:14,font:{size:10}}},y:{grid:{color:'#e5e7eb'},ticks:{callback:v=>fmtK(v),font:{size:10}}}}
    }});
  });
}

// ── INIT ──────────────────────────────────────────────────────────────────────
(async()=>{
  try {
    status('Loading data…');
    await loadData();
    status('');
  } catch(e) {
    status('Could not load data: '+e.message,true);
  }
})();
